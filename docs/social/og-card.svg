<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><rect width="1200" height="630" fill="#1A1D24"/><rect x="0" y="0" width="1200" height="6" fill="#F0B429"/><text x="64" y="106" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#F0B429" letter-spacing="2">ORACLE FUSION 26C  ·  AI AGENT STUDIO CLI</text><text x="64" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.4"><tspan fill="#E4E7EC">I built a Fusion agentic app</tspan></text><text x="64" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.4"><tspan fill="#E4E7EC">by typing </tspan><tspan fill="#F0B429">one paragraph.</tspan></text><line x1="64" y1="300" x2="1136" y2="300" stroke="#454B57" stroke-width="1"/><text x="64" y="346" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="25" fill="#B9C0CC">Oracle put its own AI Agent Studio expertise in a public repo.</text><text x="64" y="382" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="25" fill="#B9C0CC">Here is every step of driving it from Claude Code.</text><line x1="64" y1="480" x2="1136" y2="480" stroke="#31363F" stroke-width="1"/><text x="171.2" y="518" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#F0B429" text-anchor="middle">01</text><text x="171.2" y="554" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#E4E7EC" font-weight="700" text-anchor="middle" letter-spacing="-0.3">Spec first</text><line x1="278.4" y1="480" x2="278.4" y2="576" stroke="#31363F" stroke-width="1"/><text x="385.59999999999997" y="518" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#F0B429" text-anchor="middle">02</text><text x="385.59999999999997" y="554" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#E4E7EC" font-weight="700" text-anchor="middle" letter-spacing="-0.3">One gated write</text><line x1="492.8" y1="480" x2="492.8" y2="576" stroke="#31363F" stroke-width="1"/><text x="600.0" y="518" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#F0B429" text-anchor="middle">03</text><text x="600.0" y="554" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#E4E7EC" font-weight="700" text-anchor="middle" letter-spacing="-0.3">Discover first</text><line x1="707.2" y1="480" x2="707.2" y2="576" stroke="#31363F" stroke-width="1"/><text x="814.4000000000001" y="518" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#F0B429" text-anchor="middle">04</text><text x="814.4000000000001" y="554" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#E4E7EC" font-weight="700" text-anchor="middle" letter-spacing="-0.3">Fixed structure</text><line x1="921.6" y1="480" x2="921.6" y2="576" stroke="#31363F" stroke-width="1"/><text x="1028.8" y="518" font-family="SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#F0B429" text-anchor="middle">05</text><text x="1028.8" y="554" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#E4E7EC" font-weight="700" text-anchor="middle" letter-spacing="-0.3">Checks pass</text><line x1="64" y1="576" x2="1136" y2="576" stroke="#31363F" stroke-width="1"/></svg>