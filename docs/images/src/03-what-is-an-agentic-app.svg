<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-label="Diagram: live business data is read by an agent workspace that spots what needs attention, explains why it matters and suggests what to do; a human says yes; only then is a real record created in Fusion Applications. Nothing before the human approval can change your data."><rect width="900" height="384" fill="#1A1D24"/><text x="46" y="52" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#F0B429" letter-spacing="1.6">SO WHAT IS AN AGENTIC APP</text><text x="46" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5"><tspan fill="#E4E7EC">It is not a chatbot </tspan><tspan fill="#F0B429">bolted onto a dashboard.</tspan></text><rect x="46" y="130" width="160" height="150" rx="4" fill="#22262F" stroke="#454B57" stroke-width="1"/><text x="126.0" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#E4E7EC" font-weight="700" text-anchor="middle" letter-spacing="-0.2">Live business data</text><text x="126.0" y="198" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="12" fill="#8C94A3" text-anchor="middle">performance, risk,</text><text x="126.0" y="217" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="12" fill="#8C94A3" text-anchor="middle">pay, plans</text><rect x="262" y="130" width="200" height="150" rx="4" fill="#22262F" stroke="#F0B429" stroke-width="1.5"/><text x="362.0" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#F0B429" font-weight="700" text-anchor="middle" letter-spacing="-0.2">Agent workspace</text><text x="362.0" y="198" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="12" fill="#8C94A3" text-anchor="middle">spot what needs attention</text><text x="362.0" y="217" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="12" fill="#8C94A3" text-anchor="middle">explain why it matters</text><text x="362.0" y="236" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="12" fill="#8C94A3" text-anchor="middle">suggest what to do</text><rect x="518" y="130" width="130" height="150" rx="4" fill="#22262F" stroke="#454B57" stroke-width="1" stroke-dasharray="5 4"/><text x="583.0" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#E4E7EC" font-weight="700" text-anchor="middle" letter-spacing="-0.2">A human says yes</text><text x="583.0" y="198" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="12" fill="#8C94A3" text-anchor="middle">nothing changes</text><text x="583.0" y="217" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="12" fill="#8C94A3" text-anchor="middle">without this</text><rect x="704" y="130" width="150" height="150" rx="4" fill="#14171D" stroke="#4FBE86" stroke-width="1.5"/><text x="779.0" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4FBE86" font-weight="700" text-anchor="middle" letter-spacing="-0.2">Record created</text><text x="779.0" y="198" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="12" fill="#8C94A3" text-anchor="middle">a real record in</text><text x="779.0" y="217" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="12" fill="#8C94A3" text-anchor="middle">Fusion Applications</text><line x1="214" y1="205.0" x2="247" y2="205.0" stroke="#454B57" stroke-width="1.5"/><path d="M246 200.5 L254 205.0 L246 209.5 Z" fill="#454B57"/><text x="234.0" y="194.0" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8C94A3" text-anchor="middle">reads</text><line x1="470" y1="205.0" x2="503" y2="205.0" stroke="#454B57" stroke-width="1.5"/><path d="M502 200.5 L510 205.0 L502 209.5 Z" fill="#454B57"/><text x="490.0" y="194.0" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8C94A3" text-anchor="middle">suggests</text><line x1="656" y1="205.0" x2="689" y2="205.0" stroke="#4FBE86" stroke-width="1.5"/><path d="M688 200.5 L696 205.0 L688 209.5 Z" fill="#4FBE86"/><text x="676.0" y="194.0" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#4FBE86" text-anchor="middle">approved</text><rect x="46" y="296" width="602" height="34" rx="4" fill="#14171D" stroke="#31363F" stroke-width="1"/><text x="347.0" y="318" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#B9C0CC" text-anchor="middle">nothing on this side can change your data</text><text x="779.0" y="318" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#4FBE86" text-anchor="middle">one write</text></svg>