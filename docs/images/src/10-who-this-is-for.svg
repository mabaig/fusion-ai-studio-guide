<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-label="Three audiences: anyone can clone the repo and build and validate files locally, Fusion Applications customers can publish to real users, and everyone else can take the six practices."><rect width="900" height="372" fill="#1A1D24"/><text x="46" y="52" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#F0B429" letter-spacing="1.6">BEFORE WE GO FURTHER</text><text x="46" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#E4E7EC" font-weight="700" letter-spacing="-0.5">Let me be straight about who this is for.</text><text x="854" y="130" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8C94A3" text-anchor="end" letter-spacing="1.3">HOW FAR YOU GET</text><line x1="46" y1="140" x2="854" y2="140" stroke="#31363F" stroke-width="1"/><text x="46" y="172.0" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#F0B429">01</text><text x="90" y="170.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#E4E7EC" font-weight="700" letter-spacing="-0.3">Anyone</text><text x="854" y="170.0" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="13.5" fill="#8C94A3" text-anchor="end">stops at: a validated file</text><line x1="46" y1="198.0" x2="854" y2="198.0" stroke="#31363F" stroke-width="1"/><text x="46" y="230.0" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#F0B429">02</text><text x="90" y="228.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#E4E7EC" font-weight="700" letter-spacing="-0.3">Fusion Applications customers</text><text x="854" y="228.0" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="13.5" fill="#8C94A3" text-anchor="end">stops at: live for real users</text><line x1="46" y1="256.0" x2="854" y2="256.0" stroke="#31363F" stroke-width="1"/><text x="46" y="288.0" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#F0B429">03</text><text x="90" y="286.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#E4E7EC" font-weight="700" letter-spacing="-0.3">Everyone else</text><text x="854" y="286.0" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="13.5" fill="#8C94A3" text-anchor="end">stops at: the six practices</text><line x1="46" y1="314.0" x2="854" y2="314.0" stroke="#31363F" stroke-width="1"/><text x="46" y="348" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#8C94A3">no Fusion environment needed to build and validate</text></svg>