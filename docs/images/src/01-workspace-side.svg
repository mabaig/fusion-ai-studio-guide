<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" role="img" aria-label="Diagram: inside your workspace a coding agent drives the aistudio skill and CLI, which write .app, .wf and .bo files — the only files Oracle accepts. Those files are then sent over to Oracle."><rect width="900" height="516" fill="#1A1D24"/><text x="46" y="52" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#F0B429" letter-spacing="1.6">ON YOUR MACHINE</text><text x="46" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#E4E7EC" font-weight="700" letter-spacing="-0.5">You produce files. Nothing else.</text><rect x="46" y="124" width="600" height="348" rx="6" fill="none" stroke="#454B57" stroke-width="1" stroke-dasharray="5 5"/><text x="346.0" y="150" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#8C94A3" text-anchor="middle" letter-spacing="1.4">YOUR WORKSPACE</text><rect x="80" y="168" width="532" height="74" rx="4" fill="#22262F" stroke="#454B57" stroke-width="1"/><text x="346.0" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#E4E7EC" font-weight="600" text-anchor="middle">Coding agent</text><text x="346.0" y="223" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="13" fill="#8C94A3" text-anchor="middle">Claude Code, Codex, your editor</text><line x1="346.0" y1="246" x2="346.0" y2="261" stroke="#454B57" stroke-width="1.5"/><path d="M341.5 260 L346.0 268 L350.5 260 Z" fill="#454B57"/><rect x="80" y="272" width="532" height="74" rx="4" fill="#22262F" stroke="#F0B429" stroke-width="1.5"/><text x="346.0" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#F0B429" font-weight="600" text-anchor="middle">aistudio skill + CLI</text><text x="346.0" y="327" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="13" fill="#8C94A3" text-anchor="middle">Oracle's expertise, written down as files</text><line x1="346.0" y1="350" x2="346.0" y2="365" stroke="#454B57" stroke-width="1.5"/><path d="M341.5 364 L346.0 372 L350.5 364 Z" fill="#454B57"/><rect x="80" y="376" width="532" height="74" rx="4" fill="#14171D" stroke="#454B57" stroke-width="1"/><text x="346.0" y="409" font-family="SF Mono, Menlo, Consolas, monospace" font-size="17" fill="#E4E7EC" font-weight="600" text-anchor="middle" letter-spacing="1.5">.app   .wf   .bo</text><text x="346.0" y="432" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="12.5" fill="#8C94A3" text-anchor="middle">the only files Oracle accepts</text><line x1="656" y1="388" x2="843" y2="388" stroke="#F0B429" stroke-width="1.5"/><path d="M842 383.5 L850 388 L842 392.5 Z" fill="#F0B429"/><text x="660" y="376" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" fill="#F0B429">send it over</text><text x="660" y="410" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#8C94A3"></text></svg>