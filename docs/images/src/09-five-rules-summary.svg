<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" role="img" aria-label="Summary of the five rules: the spec comes first, one gated write action, discover before you build, structure over improvisation, unvalidated means unfinished."><rect width="900" height="448" fill="#1A1D24"/><text x="46" y="52" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#F0B429" letter-spacing="1.6">THE FIVE RULES</text><text x="46" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5"><tspan fill="#E4E7EC">How you ship agents when </tspan><tspan fill="#F0B429">a wrong answer is not an option.</tspan></text><text x="854" y="130" font-family="SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#8C94A3" text-anchor="end" letter-spacing="1.3">IN ONE LINE</text><line x1="46" y1="140" x2="854" y2="140" stroke="#31363F" stroke-width="1"/><text x="46" y="172.0" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#F0B429">01</text><text x="90" y="170.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#E4E7EC" font-weight="700" letter-spacing="-0.3">The spec comes first</text><text x="854" y="170.0" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="13.5" fill="#8C94A3" text-anchor="end">agree the plan in writing</text><line x1="46" y1="196.8" x2="854" y2="196.8" stroke="#31363F" stroke-width="1"/><text x="46" y="228.8" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#F0B429">02</text><text x="90" y="226.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#E4E7EC" font-weight="700" letter-spacing="-0.3">One gated write action</text><text x="854" y="226.8" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="13.5" fill="#8C94A3" text-anchor="end">it can look, not touch</text><line x1="46" y1="253.60000000000002" x2="854" y2="253.60000000000002" stroke="#31363F" stroke-width="1"/><text x="46" y="285.6" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#F0B429">03</text><text x="90" y="283.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#E4E7EC" font-weight="700" letter-spacing="-0.3">Discover before you build</text><text x="854" y="283.6" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="13.5" fill="#8C94A3" text-anchor="end">find what exists, protect it</text><line x1="46" y1="310.4" x2="854" y2="310.4" stroke="#31363F" stroke-width="1"/><text x="46" y="342.4" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#F0B429">04</text><text x="90" y="340.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#E4E7EC" font-weight="700" letter-spacing="-0.3">Structure over improvisation</text><text x="854" y="340.4" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="13.5" fill="#8C94A3" text-anchor="end">the model works inside fixed steps</text><line x1="46" y1="367.2" x2="854" y2="367.2" stroke="#31363F" stroke-width="1"/><text x="46" y="399.2" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11.5" fill="#F0B429">05</text><text x="90" y="397.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#E4E7EC" font-weight="700" letter-spacing="-0.3">Unvalidated means unfinished</text><text x="854" y="397.2" font-family="Charter, Bitstream Charter, Sitka Text, Cambria, Georgia, serif" font-size="13.5" fill="#8C94A3" text-anchor="end">done means the checks passed</text><line x1="46" y1="424.0" x2="854" y2="424.0" stroke="#31363F" stroke-width="1"/></svg>